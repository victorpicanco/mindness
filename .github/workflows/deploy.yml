name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
        required: true

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # `workflow_run.branches` filters on the head branch of the triggering run,
    # which for a pull request is the branch it came from — a fork branch named
    # `main` matches it. This job runs in the base repository with its secrets,
    # so the trigger is narrowed to pushes that this repository owns.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check the client build variables are set for the target environment
        env:
          TARGET_ENV: ${{ inputs.environment || 'staging' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set for the ${TARGET_ENV} environment"
              missing=1
            fi
          done
          exit "$missing"

      # Cloudflare's always-passes test sitekey leaves sign-up unprotected. It is
      # deliberate on staging and never acceptable on production.
      - name: Reject the turnstile test sitekey on production
        if: inputs.environment == 'production'
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          case "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" in
            1x*|2x*|3x*)
              echo "::error::NEXT_PUBLIC_TURNSTILE_SITE_KEY is a Cloudflare test sitekey"
              exit 1
              ;;
          esac

      - id: meta
        env:
          TARGET_ENV: ${{ inputs.environment || 'staging' }}
        run: |
          set -euo pipefail
          {
            echo "tag=${TARGET_ENV}-sha-$(git rev-parse --short HEAD)"
            echo "moving-tag=${TARGET_ENV}"
            echo "repo=${REGISTRY}/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the api image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}/api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}/api:${{ steps.meta.outputs.moving-tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          tags: |
            ${{ steps.meta.outputs.repo }}/web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}/web:${{ steps.meta.outputs.moving-tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    permissions:
      packages: read
    steps:
      - name: Check the host credentials are set for the target environment
        env:
          TARGET_ENV: ${{ inputs.environment || 'staging' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set for the ${TARGET_ENV} environment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Pull the new images and restart the stack
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: IMAGE_TAG,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -euo pipefail
            cd /opt/mindness
            DOCKER_CONFIG="$(mktemp -d)"
            export DOCKER_CONFIG
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            PREVIOUS_TAG="$(grep '^IMAGE_TAG=' .env | cut -d= -f2- || true)"
            echo "previous image tag: ${PREVIOUS_TAG:-none}"
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A deploy that leaves the stack unhealthy has to fail loudly: without this
      # the job goes green while Caddy serves the previous containers, or none.
      - name: Wait for the stack to report healthy and smoke test both domains
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/mindness

            deadline=$((SECONDS + 240))
            while :; do
              pending="$(docker compose ps --format '{{.Service}}|{{.State}}|{{.Health}}' \
                | awk -F'|' '$2 != "running" || ($3 != "" && $3 != "healthy") { print $1 }')"
              [ -z "$pending" ] && break
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::services never became healthy: $(echo "$pending" | tr '\n' ' ')"
                docker compose ps
                # shellcheck disable=SC2086
                docker compose logs --tail 120 $pending
                exit 1
              fi
              sleep 5
            done

            WEB_DOMAIN="$(grep '^WEB_DOMAIN=' .env | cut -d= -f2-)"
            API_DOMAIN="$(grep '^API_DOMAIN=' .env | cut -d= -f2-)"

            # Caddy carries no healthcheck, so the loop above releases it the moment it is
            # running — which, on a host whose volume holds no certificate yet, is before ACME
            # has answered. A single request then dies on a TLS alert with the stack healthy.
            # `-w` already prints 000 when curl gives up, so `|| true` keeps that status instead
            # of appending a word to it, and curl's own reason still reaches the log on stderr.
            probe() {
              curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 "$1" || true
            }

            web_answers() {
              web_status="$(probe "https://${WEB_DOMAIN}/")"
              case "$web_status" in
                2*|3*) return 0 ;;
                *) return 1 ;;
              esac
            }

            api_answers() {
              api_status="$(probe "https://${API_DOMAIN}/healthz")"
              [ "$api_status" = 200 ]
            }

            wait_for() {
              deadline=$((SECONDS + 120))
              until "$1"; do
                [ "$SECONDS" -ge "$deadline" ] && return 1
                sleep 5
              done
            }

            wait_for web_answers || {
              echo "::error::https://${WEB_DOMAIN}/ answered ${web_status}"
              exit 1
            }
            echo "web ok (${web_status})"

            wait_for api_answers || {
              echo "::error::https://${API_DOMAIN}/healthz answered ${api_status}"
              exit 1
            }
            echo "api ok (${api_status})"
