name: Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
        required: true

concurrency:
  group: migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Prisma defaults to `sslmode=prefer`, which downgrades to plaintext without
      # complaining. The connection carries the migration and the credentials, so
      # the mode is required to be explicit rather than inherited.
      - name: Check the database url is set and demands TLS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set for the ${{ inputs.environment }} environment"
            exit 1
          fi
          case "$DATABASE_URL" in
            *sslmode=require*|*sslmode=verify-ca*|*sslmode=verify-full*) ;;
            *)
              echo "::error::DATABASE_URL for ${{ inputs.environment }} does not set sslmode=require"
              exit 1
              ;;
          esac
      - run: pnpm install --frozen-lockfile --filter @mindness/api...
      - run: pnpm --filter @mindness/api db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The sync only upserts by (category, normalized title); it never deletes.
      # A theme retired from the catalog is carried as `withdrawn` so the run
      # unpublishes it instead of leaving it live.
      #
      # It runs on the driver adapter, not the schema engine, so unlike
      # `db:deploy` it verifies the chain and needs Supabase's own root. The
      # migration secret stays on `sslmode=require` and names no certificate
      # (deploy/README.md), so the string is rebuilt here against the root the
      # repository carries — the runtime one points at a path inside the image.
      - name: Sync the theme catalog
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          verified_url=$(node --input-type=module -e '
            const url = new URL(process.env.MIGRATE_DATABASE_URL)
            url.searchParams.set("sslmode", "verify-full")
            url.searchParams.set("sslrootcert", process.argv[1])
            process.stdout.write(url.toString())
          ' "${GITHUB_WORKSPACE}/apps/api/certs/supabase-prod-ca-2021.crt")
          # A workflow command decodes `%`, and the certificate path is percent-encoded.
          echo "::add-mask::${verified_url//%/%25}"
          DATABASE_URL="${verified_url}" pnpm --filter @mindness/api themes:sync
