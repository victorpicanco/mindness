name: mindness-local

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3333}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54421}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: mindness/web:local
    init: true
    ports:
      - '3000:3000'
    environment:
      API_BASE_URL: http://api:3333

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: mindness/api:local
    init: true
    ports:
      - '3333:3333'
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3333'
      TRUST_PROXY: 'false'
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: http://host.docker.internal:54421
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54422/postgres
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: mindness/api:local
    command: ['node', 'dist/worker.js']
    init: true
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      WORKER_HEALTH_PORT: '3334'
      TRUST_PROXY: 'false'
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: http://host.docker.internal:54421
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54422/postgres
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - >-
          fetch('http://127.0.0.1:' + process.env.WORKER_HEALTH_PORT +
          '/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
