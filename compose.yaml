name: mindness

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    image: ${IMAGE_REPO:?set IMAGE_REPO in .env}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    expose:
      - '3000'
    environment:
      # The browser reaches the API through the BFF, which stays on the private
      # compose network — no TLS hop and no trip back out through Caddy.
      API_BASE_URL: http://api:3333

  api:
    image: ${IMAGE_REPO:?set IMAGE_REPO in .env}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    expose:
      - '3333'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3333'
      # Only Caddy reaches this port, and it overwrites the forwarded header.
      TRUST_PROXY: 'true'
      REDIS_URL: redis://redis:6379
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-credentials.json
    volumes:
      - ./secrets/google-credentials.json:/run/secrets/google-credentials.json:ro
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: ${IMAGE_REPO:?set IMAGE_REPO in .env}/api:${IMAGE_TAG:-latest}
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      WORKER_HEALTH_PORT: '3334'
      # The health port is never published, so nothing proxies it.
      TRUST_PROXY: 'false'
      REDIS_URL: redis://redis:6379
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-credentials.json
    volumes:
      - ./secrets/google-credentials.json:/run/secrets/google-credentials.json:ro
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - >-
          fetch('http://127.0.0.1:' + process.env.WORKER_HEALTH_PORT +
          '/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # BullMQ requires noeviction: a job key dropped under memory pressure is a
    # silently lost analysis.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  caddy-data:
  caddy-config:
  redis-data:
