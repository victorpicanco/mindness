project_id = "mindness"

[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54422
shadow_port = 54420
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54423
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"
[local_smtp]
enabled = true
port = 54424

[storage]
enabled = true
file_size_limit = "50MiB"
[storage.s3_protocol]
enabled = true
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2
[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/auth/callback",
  "http://localhost:3333/auth/google/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30
[auth.captcha]
enabled = true
provider = "turnstile"
secret = "1x0000000000000000000000000000000AA"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600
[auth.email.template.confirmation]
subject = "Confirm your email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"
[auth.mfa]
max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true
[auth.web3.solana]
enabled = false
[auth.third_party.firebase]
enabled = false
[auth.third_party.auth0]
enabled = false
[auth.third_party.aws_cognito]
enabled = false
[auth.third_party.clerk]
enabled = false
[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[edge_runtime]
enabled = false
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false
port = 54427
backend = "postgres"
[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"
[experimental.pgdelta]
enabled = true

[remotes.staging]
project_id = "fvhdckpfxivorrazhpwp"

[remotes.staging.api]
enabled = false
[remotes.staging.db.ssl_enforcement]
enabled = true

[remotes.staging.storage.vector]
enabled = false

[remotes.staging.auth]
site_url = "https://dev.mindness.app"
additional_redirect_urls = [
  "https://dev.mindness.app/auth/confirm",
  "https://dev.mindness.app/auth/callback",
  "https://api.dev.mindness.app/auth/google/callback",
]

[remotes.staging.auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[remotes.staging.auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

[remotes.production]
project_id = "puqgzuabondhbkmwbsln"

[remotes.production.api]
enabled = false

[remotes.production.db.ssl_enforcement]
enabled = true

[remotes.production.storage.vector]
enabled = false

[remotes.production.auth]
site_url = "https://mindness.app"
additional_redirect_urls = [
  "https://mindness.app/auth/confirm",
  "https://mindness.app/auth/callback",
  "https://api.mindness.app/auth/google/callback",
]

[remotes.production.auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET_PRODUCTION)"
[remotes.production.auth.email]
max_frequency = "60s"

[remotes.production.auth.rate_limit]
email_sent = 100

[remotes.production.auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(SUPABASE_AUTH_SMTP_PASS_PRODUCTION)"
admin_email = "env(SUPABASE_AUTH_SENDER_EMAIL_PRODUCTION)"
sender_name = "Mindness"
[remotes.production.auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID_PRODUCTION)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET_PRODUCTION)"
skip_nonce_check = false
